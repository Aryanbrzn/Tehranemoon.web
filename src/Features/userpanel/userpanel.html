    <!-- @if (isAuthed()) { -->
    <section class="paper board-wrap">

        <div class="board">

            <ul class="rail-icons">
                <li><img src="images/business.jpg" alt="ایده"></li>
                <li><img src="images/business.jpg" alt="کافه"></li>
                <li><img src="images/business.jpg" alt="شهر"></li>
                <li><img src="images/business.jpg" alt="غذا"></li>
            </ul>

            <div class="slot-grid">
                @for (s of grid(); track $index) {
                <button class="slot" [class.filled]="!!s" (click)="openTile(s)">
                    @if (!!s) {
                    <img class="thumb" [src]="s.poster" [alt]="s.title">
                    <span class="caption">{{ s.title }}</span>
                    }
                </button>
                }
            </div>
        </div>

        <div class="paper-footer justify-content-center">
            <div class="nameplate">
                <i class="user-ico"></i>
                <span class="uname">{{ username || 'کاربر' }}</span>
            </div>
            <img class="sticker" src="images/tehran.png" alt="تهران">
        </div>
    </section>

</section>
