<div class="up-row">
    <section class="ticket-strip" dir="rtl" aria-label="نوار کاغذی">
        <!-- تکه‌نوار چسب‌ها -->
        <span class="tape tl" aria-hidden="true"></span>
        <span class="tape tr" aria-hidden="true"></span>

        <!-- لبه‌های موج‌دار با شبه‌المان‌ها ساخته می‌شوند -->

        <!-- چند خط موجی (کم‌رنگ) -->
        <div class="waves">
            <i class="wave w1"></i>
            <i class="wave w2"></i>
            <i class="wave w3"></i>
        </div>

        <!-- نوار آبی وسط -->
        <div class="blue-band">
            <span class="cut left"></span>
            <span class="cut right"></span>
        </div>

        <!-- قیمت‌ها -->
        <div class="prices">
            <span class="price left">۵ تومان</span>
            <span class="price right">۵۰ تومان</span>
        </div>

        <!-- پولاروید + فلش متن -->
        <div class="polaroid-callout">
            <span class="arrow-text">پولاروید ←</span>
            <span class="polaroid-mini" aria-hidden="true"></span>
        </div>
    </section>
</div>
