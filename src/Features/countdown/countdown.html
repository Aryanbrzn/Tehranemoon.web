<div class="countdown" aria-live="polite" [title]="targetIso">
    @if (remainMs() > 0) {
    <div class="time-unit">
        <div class="seven-segment">
            <div class="digit">{{ fa(days()) }}</div>
        </div>
        <span class="unit">روز</span>
    </div>
    <span class="sep">و</span>
    <div class="time-unit">
        <div class="seven-segment">
            <div class="digit">{{ fa(hours()) }}</div>
        </div>
        <span class="unit">ساعت</span>
    </div>
    <span class="sep">و</span>
    <div class="time-unit">
        <div class="seven-segment">
            <div class="digit">{{ fa(minutes()) }}</div>
        </div>
        <span class="unit">دقیقه</span>
    </div>
    <span class="sep">و</span>
    <div class="time-unit">
        <div class="seven-segment">
            <div class="digit">{{ fa(seconds()) }}</div>
        </div>
        <span class="unit">ثانیه</span>
    </div>
    <span class="tail">{{ label }}</span>
    } @else {
    <span class="done">زمان به پایان رسید</span>
    }
</div>
